{% extends 'base.html' %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="brand">Vans <span>Centre - Crocodille</span></div>
    <h1>Přihlášení klienta</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="login-flash">
          {% for message in messages %}<div>{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="login-form">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>
        <span>Uživatel</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>Heslo</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit">Přihlásit</button>
    </form>

    <div class="admin-entry">
      <a href="/admin/login">Administrace Vans Centre</a>
    </div>
  </div>
</div>

<style>
.login-shell{min-height:72vh;display:grid;place-items:center;padding:24px 0}.login-card{width:min(460px,100%);background:linear-gradient(155deg,rgba(25,39,59,.98),rgba(10,22,36,.98));border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.login-card h1{margin:14px 0 22px}.login-form{display:grid;gap:15px}.login-form label{display:grid;gap:7px}.login-form label span{font-size:12px;font-weight:900;letter-spacing:.45px;color:#b9c7d9;text-transform:uppercase}.login-form input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.055);color:#fff;padding:13px 14px;font-size:16px;outline:none}.login-form input:focus{border-color:rgba(88,166,255,.7)}.login-form .btn{margin-top:3px;width:100%;justify-content:center}.login-flash{margin:0 0 18px;padding:12px 14px;border-radius:12px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.22);color:#ffd0d0}.admin-entry{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center}.admin-entry a{color:var(--muted);font-size:13px}
</style>
{% endblock %}
